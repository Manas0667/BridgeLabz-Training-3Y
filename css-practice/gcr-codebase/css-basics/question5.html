<body>

    <h1>Pricing Plans</h1>

    <div class="plans">

        <div class="plan">
            <h2>Basic</h2>
            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>
            <h3>$10 / Month</h3>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan popular">

                <li>15 Projects</li>
                <li>50 GB Storage</li>

            </ul>
            <h3>$20 / Month</h3>

        <div class="plan">

                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <h3>$30 / Month</h3>
            <a href="#">Choose Plan</a>
        </div>

    </div>
