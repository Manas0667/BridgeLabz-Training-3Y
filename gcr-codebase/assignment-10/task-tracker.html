<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task-tracker.css">
</head>
<body>

    <header class="bg-primary text-white text-center py-4">
        <h1>Task Tracker</h1>
        <p class="mb-0">Manage your daily tasks efficiently</p>
    </header>

    <main class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Tasks</h2>
            <span class="badge text-bg-primary fs-6">3 Pending</span>
        </div>

        <!-- List-group items organize tasks, and badges show their priority -->
        <ul class="list-group shadow-sm">

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Complete Cloud Computing Assignment
                <span class="badge text-bg-danger">High</span>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Practice Java Programming
                <span class="badge text-bg-warning">Medium</span>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Revise HTML and CSS
                <span class="badge text-bg-success">Low</span>
            </li>

        </ul>

        <section class="mt-5">
            <h2 class="mb-3">Completed Tasks</h2>

            <button class="btn btn-success" type="button">
                Completed
                <span class="badge text-bg-light text-dark ms-2">5</span>
            </button>
        </section>

    </main>

    <footer class="text-center bg-dark text-white py-3">
        <p class="mb-0">&copy; 2026 Task Tracker</p>
    </footer>

</body>
</html>
