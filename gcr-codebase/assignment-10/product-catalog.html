<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>TechStore</h1>
    <p class="mb-0">Explore our latest products</p>
</header>

<main class="container py-5">
    <h2 class="text-center mb-4">Our Products</h2>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Headphones">
                <div class="card-body text-center">
                    <h5 class="card-title">Headphones</h5>
                    <p class="fw-bold">₹1,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Smart Watch">
                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="fw-bold">₹2,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Wireless Audio">
                <div class="card-body text-center">
                    <h5 class="card-title">Wireless Audio</h5>
                    <p class="fw-bold">₹1,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Camera">
                <div class="card-body text-center">
                    <h5 class="card-title">Digital Camera</h5>
                    <p class="fw-bold">₹5,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 TechStore</p>
</footer>

</body>
</html>
