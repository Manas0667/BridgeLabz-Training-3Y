<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal-portfolio.css">
</head>
<body class="bg-light text-dark">

<header class="container text-center mt-4 mb-3">
    <h1 class="fw-bold">Manas Varshney</h1>
    <p>Cloud and DevOps Enthusiast</p>
</header>

<main class="container">
    <section class="p-5 text-center bg-white rounded shadow-sm">

        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
             alt="Profile Image" class="img-fluid rounded-circle profile-img">

        <h2 class="mt-4 fw-bold">About Me</h2>
        <p class="mb-3">
            I am passionate about cloud computing, DevOps, and building
            reliable applications using modern technologies.
        </p>

        <a href="mailto:manas@example.com" class="btn btn-primary me-2">Hire Me</a>
        <a href="#" class="btn btn-outline-primary">Download CV</a>

        <section class="contact mt-5">
            <h3 class="fw-bold mb-3">Contact Me</h3>

            <form>
                <input type="text" class="form-control mb-3" placeholder="Your Name" required>
                <input type="email" class="form-control mb-3" placeholder="Your Email" required>
                <textarea class="form-control mb-3" rows="3" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn btn-dark">Send Message</button>
            </form>
        </section>

    </section>
</main>

<footer class="text-center py-3 mt-4">
    <p>© 2026 Manas Varshney</p>
</footer>

</body>
</html>
