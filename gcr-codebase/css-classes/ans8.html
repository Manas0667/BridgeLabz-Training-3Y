<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="ans8.css">
</head>
<body>

    <main class="container">

        <div class="box default">
            <h3>Default</h3>
            <p>Padding and border are added to the width.</p>
        </div>

        <div class="box border-box">
            <h3>Border Box</h3>
            <p>Padding and border are included in the width.</p>
        </div>

    </main>

</body>
</html>
