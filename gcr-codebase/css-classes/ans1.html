<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="ans1.css">
</head>
<body>

    <main class="examples">

        <section>
            <h3>:hover</h3>
            <a href="#">Hover over me</a>
            <p>Changes when the mouse is over it.</p>
        </section>

        <section>
            <h3>:focus</h3>
            <input type="text" placeholder="Click here">
            <p>Changes when the input is focused.</p>
        </section>

        <section>
            <h3>:active</h3>
            <button>Click me</button>
            <p>Changes while the button is clicked.</p>
        </section>

        <section>
            <h3>:nth-child()</h3>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
            <p>Styles a specific list item.</p>
        </section>

    </main>

</body>
</html>
