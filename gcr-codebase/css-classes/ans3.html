<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="ans3.css">
</head>
<body>

    <main class="gallery">

        <figure>
            <div class="image">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Nature">
            </div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
            </div>
            <figcaption>Beach</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" alt="Mountain">
            </div>
            <figcaption>Mountain</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Forest">
            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Landscape">
            </div>
            <figcaption>Landscape</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b" alt="Green Valley">
            </div>
            <figcaption>Green Valley</figcaption>
        </figure>

    </main>

</body>
</html>
