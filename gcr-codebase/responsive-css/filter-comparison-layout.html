<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

<header>
    <h1>Filter Comparison</h1>
</header>

<main>
    <section class="comparison">

        <figure>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Original image">
            <figcaption>Before</figcaption>
        </figure>

        <figure>
            <img class="filtered" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Filtered image">
            <figcaption>After</figcaption>
        </figure>

    </section>
</main>

<footer>
    <p>Filter Comparison</p>
</footer>

</body>
</html>
