<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

<header>
    <h1>Image Filter Gallery</h1>
</header>

<main>
    <section class="gallery">

        <figure>
            <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Nature">
            <figcaption>Blur</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Mountain">
            <figcaption>Grayscale</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Lake">
            <figcaption>Sepia</figcaption>
        </figure>

        <figure>
            <img class="brightness" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e" alt="Forest">
            <figcaption>Brightness</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Trees">
            <figcaption>Contrast</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Landscape">
            <figcaption>Hue Rotate</figcaption>
        </figure>

    </section>
</main>

<footer>
    <p>Responsive Image Gallery</p>
</footer>

</body>
</html>
