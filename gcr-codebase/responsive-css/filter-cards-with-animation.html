<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <link rel="stylesheet" href="filter-cards-with-animation.css">
</head>
<body>

<header>
    <h1>Profile Cards</h1>
</header>

<main>
    <section class="cards">

        <div class="card">
            <img class="grayscale" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e" alt="Profile">
            <h2>Alex</h2>
            <p>Web Developer</p>
        </div>

        <div class="card">
            <img class="sepia" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" alt="Profile">
            <h2>Emma</h2>
            <p>UI Designer</p>
        </div>

        <div class="card">
            <img class="grayscale" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d" alt="Profile">
            <h2>John</h2>
            <p>Cloud Engineer</p>
        </div>

    </section>
</main>

<footer>
    <p>Profile Cards</p>
</footer>

</body>
</html>
