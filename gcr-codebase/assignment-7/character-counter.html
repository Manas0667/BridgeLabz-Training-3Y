<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Character Counter</title>
    <style>
        #counter {
            color: green;
        }

        .warning {
            color: yellow !important;
        }

        .danger {
            color: red !important;
        }
    </style>
</head>
<body>
    <h1>Live Character Counter</h1>

    <textarea id="message" maxlength="100" rows="6" cols="40"
        placeholder="Enter your message"></textarea>

    <p id="counter">100 characters remaining</p>

    <button id="resetButton">Reset</button>

    <script src="character-counter.js"></script>
</body>
</html>
