<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Theme Switcher</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        body.light {
            background-color: white;
            color: black;
        }

        body.dark {
            background-color: #222;
            color: white;
        }

        body.blue {
            background-color: #cce5ff;
            color: #003366;
        }
    </style>
</head>
<body class="light" data-theme="light">
    <h1>Theme Switcher</h1>

    <button data-theme="light">Light Theme</button>
    <button data-theme="dark">Dark Theme</button>
    <button data-theme="blue">Blue Theme</button>

    <p>Welcome to the Theme Switcher Application.</p>

    <script src="theme-switcher.js"></script>
</body>
</html>
