<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 15px;
        }

        .gallery img {
            width: 150px;
            height: 120px;
            object-fit: cover;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        #modal img {
            max-width: 80%;
            max-height: 80%;
        }

        #modalContent {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Image Gallery</h1>

    <div class="gallery" id="gallery">
        <img src="https://picsum.photos/id/10/300/200" alt="Image 1">
        <img src="https://picsum.photos/id/20/300/200" alt="Image 2">
        <img src="https://picsum.photos/id/30/300/200" alt="Image 3">
        <img src="https://picsum.photos/id/40/300/200" alt="Image 4">
        <img src="https://picsum.photos/id/50/300/200" alt="Image 5">
        <img src="https://picsum.photos/id/60/300/200" alt="Image 6">
    </div>

    <div id="modal">
        <div id="modalContent">
            <img id="modalImage" src="" alt="Preview">
        </div>
    </div>

    <script src="image-gallery.js"></script>
</body>
</html>
