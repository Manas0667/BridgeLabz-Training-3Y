<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Form</title> 
</head> 
<body> 

    <h1>My Form</h1>

    <form action="result.html" target="resultFrame">
        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name">

        <input type="submit" value="Submit">
    </form>

    <br>

  
    <iframe 
        name="resultFrame"
        width="80%"
        height="200"
        title="Form Result">
    </iframe>
     
</body> 
</html>
