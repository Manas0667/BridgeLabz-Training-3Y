<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>
</head>
<body>
    <h1>Course Registration Form</h1>
    <form>

    <fieldset>
        <legend>Student Details</legend>

        Name:
        <input type="text" name="name"><br><br>

        Email:
        <input type="email" name="email"><br><br>

        Course:
        <select name="course">
            <option>Java</option>
            <option>Python</option>
            <option>Web Development</option>
        </select><br><br>

        <input type="submit" value="Register">
    </fieldset>

</form>

<h2>Course Schedule</h2>

<table border="1">
    <tr>
        <th>Day</th>
        <th>Time</th>
        <th>Instructor</th>
    </tr>

    <tr>
        <td>Monday</td>
        <td>10:00 AM</td>
        <td>Mr. Yash</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>12:00 PM</td>
        <td>Mr. Yash</td>
    </tr>

    <tr>
        <td>Friday</td>
        <td>2:00 PM</td>
        <td>Mr. Yash</td>
    </tr>
</table>

</body>
</html>
